server {
    listen 80;
    listen 127.0.0.1;
    server_name localhost 127.0.0.1;

    location / {
        proxy_pass http://127.0.0.1:5173;
    }
    
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
    }
    
    location /rosbridge {
        proxy_pass http://127.0.0.1:9090/;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}